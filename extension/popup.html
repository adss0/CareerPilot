<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to CareerPilot</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="src/popup.js"></script>
  </head>
  <body>
    <header>
      <img src="icons/32.png" alt="" width="20" height="20" />
      <h1>Save to CareerPilot</h1>
    </header>

    <p id="status" role="status">Looking for CareerPilot…</p>

    <form id="form" hidden>
      <label>
        Company
        <input id="company" name="company" maxlength="200" autocomplete="off" />
      </label>
      <label>
        Role
        <input id="role" name="role" maxlength="200" autocomplete="off" />
      </label>
      <p id="hint" class="hint"></p>
      <p id="source" class="hint"></p>
      <div id="warnings" class="warning" role="alert" hidden></div>
      <button id="save" type="submit">Save job</button>
    </form>

    <button id="retry" type="button" class="secondary" hidden>Try again</button>
  </body>
</html>
