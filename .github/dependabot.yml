# Opens a PR when a dependency has a security fix or a new version. One grouped PR per
# ecosystem a month (security fixes come straight away), and each one runs the full CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # sqlmodel after 0.0.24 refuses dates without a time zone, and every date already saved
      # in people's databases has none. Moving needs a migration, not a version bump.
      - dependency-name: sqlmodel

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: monthly

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: monthly
    groups:
      tauri:
        patterns: ["*"]
        update-types: [minor, patch]
