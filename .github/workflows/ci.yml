name: CI

# Every PR and every push to main. The jobs run side by side (about 3-4 minutes in all), and
# the "CI passed" job at the end is the one check main's branch protection requires: if any
# job fails, or is cancelled, the PR can't be merged.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the run that's still going for the old commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    # The version is in seven files; a missed one breaks the installer and auto-updates.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/check_version.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../scripts
      - run: ruff format --check . ../scripts
      # Warnings that point at real bugs (e.g. an un-awaited coroutine) fail the run.
      # Coverage is about 95%; the gate stops it sliding.
      - run: >-
          pytest -q -p no:cacheprovider -W error::RuntimeWarning
          --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=92

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint # zero warnings allowed
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The "Save to CareerPilot" browser extension: plain JavaScript, tested with Node.
      - name: Browser extension
        run: |
          npx prettier --check ../extension
          node -e "JSON.parse(require('fs').readFileSync('../extension/manifest.json'))"
          node --test ../extension/tests/

  e2e:
    # A real browser through import → AI letter → approve → send, against the real backend,
    # a fake AI and a local test mail server (never real AI or real email).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      # The browser download is cached per Playwright version (saves about a minute).
      - id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium
      - working-directory: frontend
        run: npm run e2e
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-results
          path: frontend/test-results

  audit:
    # Known security holes in the app's dependencies. Shown on every PR but not required: a
    # new advisory with no fix yet shouldn't block unrelated work. Dependabot opens the fixes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pipx run pip-audit -r backend/requirements.txt
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  ci-passed:
    name: CI passed
    if: always()
    needs: [versions, backend, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || { echo "A required job didn't pass."; exit 1; }; done
