name: Desktop app

# Builds the Windows installer and publishes releases.
# - PRs that touch the app: build and smoke-test the installer (not required to merge).
# - After CI passes on main: if the version in tauri.conf.json has no release yet, build it,
#   tag it vX.Y.Z and publish the release. Installed apps find it through latest.json and
#   update themselves. Merging without a version bump publishes nothing.
on:
  pull_request:
    paths: ["backend/**", "frontend/**", "desktop/**", ".github/workflows/desktop.yml"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Works out the version, and whether this run publishes a release.
    # Only CI runs for pushes to main in this repository count (never a fork's PR).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version=$(python3 scripts/check_version.py)
          publish=false
          if [ "$EVENT" = "workflow_run" ]; then
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$version is already released: nothing to publish."
            else
              publish=true
              echo "v$version is new: building and publishing it."
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: github.event_name != 'workflow_run' || needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build the backend (PyInstaller)
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller==6.22.3
          pyinstaller careerpilot-server.spec --noconfirm --distpath dist

      - name: Smoke-test the backend exe
        shell: pwsh
        working-directory: backend
        run: |
          $env:CAREERPILOT_HOME = "$env:RUNNER_TEMP\careerpilot-home"
          $env:CAREERPILOT_PORT = "8799"
          Start-Process dist\careerpilot-server.exe | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $health = Invoke-RestMethod http://127.0.0.1:8799/api/health -TimeoutSec 2
              if ($health.status -eq "ok") { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          Get-Process careerpilot-server -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) {
            Get-Content "$env:CAREERPILOT_HOME\careerpilot-server.log" -ErrorAction SilentlyContinue
            throw "The bundled backend did not start."
          }
          "Bundled backend started and answered /api/health."

      - name: Put the backend where Tauri expects it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item backend/dist/careerpilot-server.exe desktop/src-tauri/binaries/careerpilot-server-x86_64-pc-windows-msvc.exe

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Build the frontend for the desktop
        working-directory: frontend
        run: |
          npm ci
          npm run build:desktop

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build the installer (Tauri)
        working-directory: desktop
        shell: bash
        env:
          # Signs the update so installed apps trust it. Without the secret (e.g. a fork) the
          # installer is still built, just without the update files.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            echo "No signing key: building without update files."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: CareerPilot-windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  release:
    needs: [plan, windows]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: CareerPilot-windows-installer
          path: installer
      # The release notes are this version's section of the changelog.
      - name: Release notes from the changelog
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "CareerPilot $VERSION." > notes.md
          cat notes.md
      # latest.json tells installed apps there's a new version. Without it (an unsigned
      # build) nothing would update, so the release stops here instead.
      - name: Write latest.json for auto-updates
        env:
          REPO: ${{ github.repository }}
        run: |
          sig=$(ls installer/nsis/*-setup.exe.sig 2>/dev/null | head -1 || true)
          if [ -z "$sig" ]; then
            echo "::error::The installer isn't signed (is TAURI_SIGNING_PRIVATE_KEY set?)."
            exit 1
          fi
          exe=$(basename "${sig%.sig}")
          python3 - "$sig" "$exe" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          sig, exe = sys.argv[1], sys.argv[2]
          version, repo = os.environ["VERSION"], os.environ["REPO"]
          manifest = {
              "version": version,
              "notes": open("notes.md", encoding="utf-8").read().strip(),
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": open(sig).read().strip(),
                      "url": f"https://github.com/{repo}/releases/download/v{version}/{exe}",
                  }
              },
          }
          json.dump(manifest, open("installer/latest.json", "w"), indent=2)
          PY
          cat installer/latest.json
      # Published (not a draft) and marked latest: that's the address the app checks.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: CareerPilot ${{ env.VERSION }}
          body_path: notes.md
          draft: false
          make_latest: "true"
          files: installer/**/*
