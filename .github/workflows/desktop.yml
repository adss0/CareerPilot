name: Desktop app

# Builds the Windows installer. Runs on PRs that touch the app, on demand, and on version tags
# (a tag like v1.0.0 also creates a draft GitHub Release with the installer attached).
on:
  pull_request:
    paths: ["backend/**", "frontend/**", "desktop/**", ".github/workflows/desktop.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build the backend (PyInstaller)
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller==6.22.3
          pyinstaller careerpilot-server.spec --noconfirm --distpath dist

      - name: Smoke-test the backend exe
        shell: pwsh
        working-directory: backend
        run: |
          $env:CAREERPILOT_HOME = "$env:RUNNER_TEMP\careerpilot-home"
          $env:CAREERPILOT_PORT = "8799"
          Start-Process dist\careerpilot-server.exe | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $health = Invoke-RestMethod http://127.0.0.1:8799/api/health -TimeoutSec 2
              if ($health.status -eq "ok") { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          Get-Process careerpilot-server -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) {
            Get-Content "$env:CAREERPILOT_HOME\careerpilot-server.log" -ErrorAction SilentlyContinue
            throw "The bundled backend did not start."
          }
          "Bundled backend started and answered /api/health."

      - name: Put the backend where Tauri expects it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item backend/dist/careerpilot-server.exe desktop/src-tauri/binaries/careerpilot-server-x86_64-pc-windows-msvc.exe

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Build the frontend for the desktop
        working-directory: frontend
        run: |
          npm ci
          npm run build:desktop

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build the installer (Tauri)
        working-directory: desktop
        shell: bash
        env:
          # Signs the update so installed apps trust it. Without the secret (e.g. a fork) the
          # installer is still built, just without the update files.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            echo "No signing key: building without update files."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CareerPilot-windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CareerPilot-windows-installer
          path: installer
      # latest.json tells installed apps there's a new version (only when the build was signed).
      - name: Write latest.json for auto-updates
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          sig=$(ls installer/nsis/*-setup.exe.sig 2>/dev/null | head -1 || true)
          if [ -z "$sig" ]; then echo "Unsigned build: no latest.json."; exit 0; fi
          exe=$(basename "${sig%.sig}")
          python3 - "$sig" "$exe" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          sig, exe = sys.argv[1], sys.argv[2]
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          manifest = {
              "version": tag.lstrip("v"),
              "notes": f"CareerPilot {tag}: see the release notes on GitHub.",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": open(sig).read().strip(),
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{exe}",
                  }
              },
          }
          json.dump(manifest, open("installer/latest.json", "w"), indent=2)
          PY
          cat installer/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: installer/**/*
